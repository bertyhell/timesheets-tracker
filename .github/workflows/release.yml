name: Release

on:
  push:
    tags:
      - 'v*'

  # Allows you to run the Pages deploy manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install api dependencies
        run: npm ci
        working-directory: api

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build api
        run: npm run build:api

      - name: Build client
        run: npm run build:client

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-pages:
    needs: e2e
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the GitHub Pages site lives here
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build:
    needs: e2e
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-script: build:linux
          - os: windows-latest
            build-script: build:win
          - os: macos-latest
            build-script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install api dependencies
        run: npm ci
        working-directory: api

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build and publish
        run: npm run ${{ matrix.build-script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && 'false' || '' }}

  notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Append macOS install note to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY="$(gh release view "$TAG" --json body -q .body)"
          NOTE='

          ## macOS install note

          This app is not code-signed or notarized (no paid Apple Developer account). On first launch, macOS will say `"Timesheets Tracker.app" is damaged and can'"'"'t be opened`. This is not actual damage — it'"'"'s Gatekeeper blocking an unsigned, unnotarized download. To fix it, run once in Terminal:

          ```shell
          xattr -cr "/Applications/Timesheets Tracker.app"
          ```

          If that fails with `Operation not permitted`, your terminal app needs Full Disk Access: System Settings → Privacy & Security → Full Disk Access → enable it for your terminal app, then fully quit and reopen the terminal and try again.'
          printf '%s%s\n' "$BODY" "$NOTE" | gh release edit "$TAG" --notes-file -
