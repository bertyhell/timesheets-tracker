<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timesheet Tracker Options</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      min-width: 300px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    #status {
      margin-top: 10px;
      color: green;
    }
  </style>
</head>
<body>
  <h2>Timesheet Tracker Options</h2>
  <label for="api-url">API URL</label>
  <input type="text" id="api-url" placeholder="http://localhost:55577/api" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
