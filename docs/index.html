<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timesheets Tracker</title>
  <meta name="description" content="Track active window and tag programs to easily track timesheets." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --accent: #7c3aed;
      --accent-dark: #6d28d9;
      --bg: #f6f5f8;
      --card-bg: #ffffff;
      --text: #18181b;
      --muted: #6b6b74;
      --border: #e7e5ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121116;
        --card-bg: #1c1b22;
        --text: #f2f1f5;
        --muted: #9a98a3;
        --border: #2d2c34;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .logo {
      width: 160px;
      height: 160px;
      margin: 0 auto 28px;
      display: block;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p.tagline {
      color: var(--muted);
      margin: 0 0 32px;
      font-size: 1rem;
      line-height: 1.5;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
    }
    .download-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 22px 20px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .download-btn:hover { background: var(--accent-dark); }
    .download-btn:active { transform: translateY(1px); }
    .download-btn[aria-disabled="true"] {
      pointer-events: none;
      opacity: 0.6;
    }
    #download-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .btn-icon { display: flex; }
    .btn-icon svg { width: 36px; height: 36px; flex-shrink: 0; }
    .version {
      margin: 14px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .other-versions {
      margin-top: 22px;
      font-size: 0.9rem;
    }
    .other-versions a {
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: var(--border);
      text-underline-offset: 3px;
    }
    .other-versions a:hover { color: var(--text); }
    footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 512 512" role="img" xmlns="http://www.w3.org/2000/svg">
      <title>Timesheets Tracker logo</title>
      <circle cx="256" cy="276" r="224" fill="#111"/>
      <circle cx="256" cy="66"  r="59"  fill="#111"/>
      <circle cx="121" cy="115" r="59"  fill="#111"/>
      <circle cx="391" cy="115" r="59"  fill="#111"/>
      <circle cx="256" cy="276" r="210" fill="#7c3aed"/>
      <circle cx="256" cy="66"  r="45"  fill="#7c3aed"/>
      <circle cx="121" cy="115" r="45"  fill="#7c3aed"/>
      <circle cx="391" cy="115" r="45"  fill="#7c3aed"/>
      <circle cx="256" cy="276" r="163" fill="white"/>
      <path d="M 256,276 L 256,96 A 180,180 0 0,1 436,276 Z" fill="#7c3aed"/>
    </svg>

    <h1>Timesheets Tracker</h1>
    <p class="tagline">Track active windows, tag your activity, and get a summed overview of hours spent per customer or project.</p>

    <div class="card">
      <a id="download-btn" class="download-btn" aria-disabled="true" href="https://github.com/bertyhell/timesheets-tracker/releases/latest">
        <span id="download-label">Detecting your platform…</span>
      </a>
      <p class="version" id="version-label">&nbsp;</p>

      <p class="other-versions">
        <a href="https://github.com/bertyhell/timesheets-tracker/releases/latest">Other versions &amp; platforms (Windows / macOS / Linux) &rarr;</a>
      </p>
    </div>

    <footer>
      <a href="https://github.com/bertyhell/timesheets-tracker">View source on GitHub</a>
    </footer>
  </main>

  <script>
    const REPO = 'bertyhell/timesheets-tracker';
    const RELEASES_URL = `https://github.com/${REPO}/releases/latest`;

    const icons = {
      windows: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5 10.4 4.5v7H3zM11.3 4.4 21 3v8.5h-9.7zM3 12.5h7.4v7L3 18.5zM11.3 12.5H21V21l-9.7-1.4z"/></svg>',
      apple: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.415 2.19-1.14 3.02-.83.94-2.13 1.66-3.31 1.57-.14-1.09.44-2.24 1.14-2.99.79-.87 2.16-1.53 3.31-1.6zM20.6 17.13c-.55 1.25-.81 1.8-1.5 2.9-.98 1.53-2.36 3.44-4.07 3.46-1.52.02-1.91-.99-3.97-.98-2.06.01-2.49.99-4.02.98-1.71-.02-3.02-1.74-4-3.26-2.75-4.24-3.04-9.22-1.34-11.87 1.2-1.9 3.11-3.02 4.9-3.02 1.82 0 2.97 1 4.48 1 1.46 0 2.35-1 4.48-1 1.61 0 3.31.88 4.53 2.4-3.98 2.18-3.33 7.86.48 9.4z"/></svg>',
      linux: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-1.6 0-2.9 1.5-2.9 3.6 0 1.3.4 2.1.4 3.3 0 .9-.6 1.6-1.3 2.5C7 12.7 6 14 6 16.3c0 3 2.3 5.7 6 5.7s6-2.7 6-5.7c0-2.3-1-3.6-2.2-4.9-.7-.9-1.3-1.6-1.3-2.5 0-1.2.4-2 .4-3.3C14.9 3.5 13.6 2 12 2z"/></svg>',
    };

    function detectPlatform() {
      const ua = navigator.userAgent || '';
      const platform = navigator.platform || '';
      if (/Win/i.test(ua) || /Win/i.test(platform)) return 'windows';
      if (/Mac/i.test(ua) || /Mac/i.test(platform)) return 'mac';
      if (/Linux/i.test(ua) || /Linux/i.test(platform) || /Android/i.test(ua)) return 'linux';
      return 'unknown';
    }

    // Best-effort Apple Silicon vs Intel detection via WebGL renderer string.
    function detectAppleSilicon() {
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        const debugInfo = gl && gl.getExtension('WEBGL_debug_renderer_info');
        if (debugInfo) {
          const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || '';
          if (/Apple M/i.test(renderer) || /Apple GPU/i.test(renderer)) return true;
          if (/Intel/i.test(renderer) || /AMD/i.test(renderer)) return false;
        }
      } catch (e) {
        // ignore, fall through to default
      }
      return null;
    }

    function pickAsset(assets, platform) {
      const byName = (re) => assets.find((a) => re.test(a.name));
      if (platform === 'windows') {
        return byName(/Setup.*\.exe$/i);
      }
      if (platform === 'mac') {
        const isArm = detectAppleSilicon();
        if (isArm === true) return byName(/-arm64\.dmg$/i) || byName(/\.dmg$/i);
        if (isArm === false) return byName(/^(?!.*arm64).*\.dmg$/i) || byName(/\.dmg$/i);
        return byName(/^(?!.*arm64).*\.dmg$/i) || byName(/\.dmg$/i);
      }
      if (platform === 'linux') {
        return byName(/\.AppImage$/i);
      }
      return null;
    }

    async function init() {
      const btn = document.getElementById('download-btn');
      const label = document.getElementById('download-label');
      const versionLabel = document.getElementById('version-label');
      const platform = detectPlatform();

      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
        if (!res.ok) throw new Error('Failed to fetch latest release');
        const release = await res.json();
        const assets = release.assets || [];
        const asset = pickAsset(assets, platform);

        versionLabel.textContent = release.tag_name ? `Latest version: ${release.tag_name}` : '';

        if (asset) {
          const platformNames = { windows: 'Windows', mac: 'macOS', linux: 'Linux' };
          const icon = icons[platform === 'mac' ? 'apple' : platform] || '';
          btn.href = asset.browser_download_url;
          btn.removeAttribute('aria-disabled');
          label.innerHTML = `<span class="btn-icon">${icon}</span><span class="btn-text">Download for ${platformNames[platform] || platform}</span>`;
        } else {
          btn.href = RELEASES_URL;
          btn.removeAttribute('aria-disabled');
          label.textContent = 'Go to all downloads';
        }
      } catch (err) {
        btn.href = RELEASES_URL;
        btn.removeAttribute('aria-disabled');
        label.textContent = 'Go to all downloads';
        versionLabel.textContent = '';
      }
    }

    init();
  </script>
</body>
</html>
